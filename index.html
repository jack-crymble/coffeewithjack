<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee with Jack</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <main class="page">
      <div class="avatar-ring">
        <div class="avatar">
          <img
            src="profile.jpg"
            alt=""
            onerror="
              this.style.display = 'none';
              this.nextElementSibling.style.display = 'flex';
            "
          />
          <span class="placeholder" style="display: none">JC</span>
        </div>
      </div>

      <h1 class="name">Coffee with Jack</h1>

      <p class="bio">
        ☕️ Demystifying home coffee </br>
        🫘 Local bean guy </br>
        ⌨️ Swapping code for coffee
      </p>

      <nav class="links" aria-label="Social media links">
        <a
          class="link"
          href="https://www.tiktok.com/@coffee_with_jack"
          target="_blank"
          rel="noopener"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M13 3v11.5a3.5 3.5 0 1 1-3.5-3.5" />
            <path d="M13 3a5 5 0 0 0 5 5" />
            <path d="M18 8v3a8 8 0 0 1-5-2" />
          </svg>
          TikTok
        </a>

        <a
          class="link"
          href="https://www.instagram.com/coffee_with_jack"
          target="_blank"
          rel="noopener"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="3.5" />
            <circle
              cx="17.2"
              cy="6.8"
              r="0.6"
              fill="currentColor"
              stroke="none"
            />
          </svg>
          Instagram
        </a>

        <a
          class="link"
          href="https://www.youtube.com/@coffee_with_jack"
          target="_blank"
          rel="noopener"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2.5" y="5.5" width="19" height="13" rx="4" />
            <path
              d="M10.5 9.5l4 2.5-4 2.5z"
              fill="currentColor"
              stroke="none"
            />
          </svg>
          YouTube
        </a>

        <a
          class="link"
          href="https://www.facebook.com/coffeewithjackofficial"
          target="_blank"
          rel="noopener"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M15 4h-2a3 3 0 0 0-3 3v3H7v3h3v7h3v-7h2.5l.5-3H13V7a1 1 0 0 1 1-1h1z"
            />
          </svg>
          Facebook
        </a>
      </nav>
    </main>
  </body>
</html>
